# Cover Forge — static frontend + API reverse proxy.
# Adjust server_name and add TLS (certbot or your existing cert) for production.

server {
    listen 80;
    server_name coverforge.example.lan;

    # Static frontend
    root /opt/cover-forge/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API -> gunicorn on 127.0.0.1:5004
    location /api/ {
        proxy_pass http://127.0.0.1:5004;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Large cover renders / image uploads:
        client_max_body_size 25m;
        proxy_read_timeout 120s;
    }
}
